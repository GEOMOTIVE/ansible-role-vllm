---

- include_vars: "{{ item }}"
  with_first_found:
  - "../vars/{{ansible_distribution}}-{{ansible_distribution_version}}.yml"
  - "../vars/{{ansible_distribution}}-{{ansible_distribution_major_version}}.yml"
  - "../vars/{{ansible_distribution}}.yml"
  - "../vars/{{ansible_os_family}}.yml"
  - "../vars/default.yml"

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install OS dependencies
  apt:
    name: "{{ VLLM_DEFAULT_PACKAGES }}"
    state: present

- name: Create vLLM group
  group:
    name: "{{ vllm_group }}"
    state: present

- name: Create vLLM user
  user:
    name: "{{ vllm_user }}"
    group: "{{ vllm_group }}"
    home: "{{ vllm_root_dir }}"
    shell: /usr/sbin/nologin
    create_home: no
    system: yes

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    group: "{{ vllm_group }}"
    mode: "0755"
  loop:
    - "{{ vllm_root_dir }}"
    - "{{ vllm_download_dir }}"
    - "{{ vllm_cache_dir }}"
    - "{{ vllm_log_dir }}"

- name: Create Python venv
  command: "python3 -m venv {{ vllm_venv_dir }}"
  args:
    creates: "{{ vllm_venv_dir }}/bin/activate"

- name: Upgrade pip/setuptools/wheel in venv
  command: "{{ vllm_venv_dir }}/bin/pip install --upgrade pip setuptools wheel"

- name: (GPU) Install PyTorch CUDA wheels
  when: use_gpu | bool
  vars:
    torch_spec: >-
      torch{{ ('==' + torch_version) if torch_version|length > 0 else '' }}
      torchvision
      torchaudio
  command: >-
    {{ vllm_venv_dir }}/bin/pip install
    --extra-index-url https://download.pytorch.org/whl/{{ pytorch_cuda_channel }}
    {{ torch_spec }}

- name: (CPU) Install PyTorch CPU wheels
  when: not use_gpu | bool
  vars:
    torch_spec: >-
      torch{{ ('==' + torch_version) if torch_version|length > 0 else '' }}
      torchvision
      torchaudio
  command: >-
    {{ vllm_venv_dir }}/bin/pip install {{ torch_spec }}

- name: Show torch version
  command: "{{ vllm_venv_dir }}/bin/python -c 'import torch; print({\"torch\": torch.__version__, \"cuda\": torch.version.cuda, \"cuda_available\": torch.cuda.is_available()})'"
  register: torch_info

- name: Debug torch info
  debug:
    var: torch_info.stdout

- name: (Optional) Verify NVIDIA driver presence
  when: use_gpu | bool
  command: nvidia-smi
  register: nvsmi
  changed_when: false
  failed_when: nvsmi.rc != 0

- name: Install vLLM (and extras)
  vars:
    vllm_pkg: >-
      vllm{{ ('==' + vllm_version) if vllm_version|length > 0 else '' }}
  command: "{{ vllm_venv_dir }}/bin/pip install {{ vllm_pkg }}"

# Optional, often beneficial on recent GPUs; safe to skip if it fails
- name: Try installing flash-attn (best-effort)
  when: use_gpu | bool
  shell: |
    set -o pipefail
    {{ vllm_venv_dir }}/bin/pip install flash-attn --no-build-isolation || true
  args:
    executable: /bin/bash

- name: Create vLLM systemd unit
  template:
    src: vllm.service.j2
    dest: /etc/systemd/system/vllm.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vLLM

- name: Enable service
  systemd:
    name: vllm
    enabled: true
    daemon_reload: true
    state: started

- name: Open firewall for vLLM
  when: configure_ufw
  ufw:
    rule: allow
    port: "{{ vllm_port }}"
    proto: tcp

- name: Wait for vLLM to start listening
  wait_for:
    host: "127.0.0.1"
    port: "{{ vllm_port }}"
    delay: 2
    timeout: 300

- name: Probe /v1/models
  uri:
    url: "http://127.0.0.1:{{ vllm_port }}/v1/models"
    method: GET
    status_code: 200
    headers:
      Authorization: Bearer {{ api_key }}
  register: probe

- name: Show vLLM models
  debug:
    var: probe.json
