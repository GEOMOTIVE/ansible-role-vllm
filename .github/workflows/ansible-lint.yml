name: ansible-lint
on:
  push:
jobs:
  lint:
    name: Ansible Lint # Naming the build is important to use it as a status check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.8.1
        # optional (see below):
        with:
          args: ""
          gh_action_ref: "v25.8.1" # Not recommended for non-composite action use
          setup_python: "true"
          working_directory: ""
          requirements_file: ""
